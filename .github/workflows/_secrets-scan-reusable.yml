name: Secrets Scan (Callable)
# Reusable Gitleaks secrets scan. Uses the OSS gitleaks CLI (pinned version +
# checksum) — no Gitleaks org license required. Fail-closed on findings.
# Dependabot PRs no-op successfully (near-zero signal; saves Actions minutes).
# Emits check "secrets-scan / Gitleaks" via the thin caller job id.
#
# Access: invocable from any repo in the N3m3s1sGr0up org. See
# templates/callers/secrets-scan.yml for the thin caller.

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "Pinned gitleaks CLI version (no v prefix). Never 'latest'."
        required: false
        type: string
        default: "8.30.1"
      gitleaks-sha256:
        description: "SHA-256 of gitleaks_*_linux_x64.tar.gz for gitleaks-version."
        required: false
        type: string
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      enable-harden-runner:
        description: "Whether to install StepSecurity Harden-Runner."
        required: false
        type: boolean
        default: true
      harden-runner-policy:
        description: "Harden-Runner egress policy: 'audit' or 'block'."
        required: false
        type: string
        default: "audit"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Prefer PR author over github.actor (zizmor: bot-actor spoofable).
      - name: Skip for Dependabot
        id: skip
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: echo "Skipping Gitleaks for Dependabot (no secret-intro risk)."

      - name: Harden Runner
        if: ${{ inputs.enable-harden-runner && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') }}
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ inputs.harden-runner-policy }}
          disable-sudo-and-containers: true

      - name: Checkout code
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') }}
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
          GITLEAKS_SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -eu
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -sSfL "$URL" -o "$ARCHIVE"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          chmod +x gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
          ./gitleaks version

      - name: Run Gitleaks
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: gitleaks detect --source . --verbose --redact --exit-code 1
