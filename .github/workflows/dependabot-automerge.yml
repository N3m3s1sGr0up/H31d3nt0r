name: Dependabot Auto-Merge
# VENDORED from org-workflows v0.7.0 (public repo cannot uses: private hub).
on:
  pull_request: { branches: [main] }
permissions:
  contents: read
  checks: read
jobs:
  automerge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    uses: ./.github/workflows/_dependabot-automerge-reusable.yml
    with:
      enable-harden-runner: false
      max-wait-minutes: 5
      poll-interval-seconds: 30
      required-checks: |
        zizmor / Zizmor Workflow Audit
    permissions:
      contents: read
      checks: read
    secrets:
      ci-app-id: ${{ secrets.N3M3S1S_CI_APP_ID }}
      ci-private-key: ${{ secrets.N3M3S1S_CI_PRIVATE_KEY }}
